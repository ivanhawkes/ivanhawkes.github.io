## Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Publish the website

on:
    # This will publish the site again when a push to these branches happens.
    push:
        branches:
            - posts

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

## Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

## Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
## However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
    group: 'pages'
    cancel-in-progress: false

## Default to bash
defaults:
    run:
        shell: bash

jobs:
    # Build job
    build:
        runs-on: ubuntu-latest

        env:
            GO_VERSION: 1.26.7
            HUGO_VERSION: 0.166.0
            NODE_VERSION: 24.20.0
            TZ: Australia/Brisbane

        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: recursive
                  fetch-depth: 0
                  lfs: true

            # Modern action: Handles both pnpm and Node.js setup plus caching automatically
            - uses: pnpm/setup@v2
              with:
                  version: 11
                  runtime: node@${{ env.NODE_VERSION }}
                  #   cache: true

            - run: pnpm i

            - name: Install Hugo
              run: |
                  curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
                  mkdir -p "${HOME}/hugo"
                  tar -C "${HOME}/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
                  rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
                  echo "${HOME}/hugo" >> "${GITHUB_PATH}"
                  export HUGO_PATH=${HOME}/hugo/hugo
                  echo "${HUGO_PATH}"
                  echo "Version:"
                  $HUGO_PATH version

              #   git clone --recursive https://github.com/ivanhawkes/ivanhawkes.github.io.git
              #   cd ivanhawkes.github.io/
              #   export HUGO_VERSION=0.166.0
              #   curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
              #   mkdir -p "${HOME}/hugo"
              #   tar -C "$HOME/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
              #   rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
              #   echo "${HOME}/hugo" >> "${GITHUB_PATH}"

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                  go-version: ${{ env.GO_VERSION }}
                  #   cache: false

            - name: Setup Pages
              id: pages
              uses: actions/configure-pages@v6

            - name: Create directory for user-specific executable files
              run: |
                  mkdir -p "${HOME}/.local"

            - name: Verify installations
              run: |
                  echo "Versions:"
                  echo "  Go: $(go version)"
                  echo "  Node.js: $(node --version)"
                  echo "  Hugo: $(hugo version)"

            - name: Configure Git
              run: |
                  git config core.quotepath false

            - name: Compute cache key
              id: cache-key
              run: |
                  # Hugo version + theme submodule pin + site config. Content
                  # is left out on purpose: the resource cache is keyed by
                  # asset content, and the prefix restore covers partial hits.
                  config_hash=$(find config -type f -print0 | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
                  theme_pin=$(git ls-tree HEAD themes/be-best | awk '{print $3}')
                  key="hugo-${HUGO_VERSION}-${theme_pin}-${config_hash:0:16}"
                  echo "key=${key}" >> "$GITHUB_OUTPUT"
                  echo "Cache key: ${key}"

            # - name: Cache restore
            #   id: cache-restore
            #   uses: actions/cache/restore@v5
            #   with:
            #       path: ${{ runner.temp }}/hugo_cache
            #       key: ${{ steps.cache-key.outputs.key }}
            #       restore-keys: |
            #           hugo-${{ env.HUGO_VERSION }}-

            - name: Build the CSS using Tailwind CSS
              run: |
                  pnpm dlx @tailwindcss/cli -i themes/be-best/assets/css/main.css -o assets/css/main.css --minify

            # 🛠️ Cleaned up multi-line spaces that broke the bash parameters line breaks
            - name: Build the site
              run: |
                  hugo build \
                    --environment production \
                    --gc \
                    --minify \
                    --ignoreCache \
                    --cleanDestinationDir \
                    --baseURL "${{ steps.pages.outputs.base_url }}" # \
                    # --cacheDir "${{ runner.temp }}/hugo_cache"

            # - name: Cache save
            #   id: cache-save
            #   uses: actions/cache/save@v5
            #   with:
            #       path: ${{ runner.temp }}/hugo_cache
            #       key: ${{ steps.cache-key.outputs.key }}

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ./public

    # Deployment job
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
