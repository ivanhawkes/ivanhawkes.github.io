# The structured data every page carries in its head: one JSON-LD block whose
# @graph holds the nodes below, written by
# be-best/layouts/_partials/meta/jsonld.html. A recipe's Recipe block is defined
# apart, in assets/recipe-jsonld.yaml. scripts/validate-jsonld.mjs reads every
# built page back against this file.
block:
  type: object
  required: ['@context', '@graph']
  additionalProperties: false
  properties:
    '@context': { type: string, const: 'https://schema.org' }
    '@graph':
      type: array
      minItems: 1
      items:
        oneOf:
          - $ref: '#/components/schemas/webSite'
          - $ref: '#/components/schemas/blogPosting'
          - $ref: '#/components/schemas/aboutPage'
          - $ref: '#/components/schemas/profilePage'
          - $ref: '#/components/schemas/breadcrumbList'
components:
  schemas:
    url: { type: string, format: uri, pattern: '^https://' }
    text: { type: string, minLength: 1 }
    date: { type: string, format: date }
    language: { type: string, pattern: '^[a-z]{2,3}(-[A-Z]{2})?$' }
    person:
      type: object
      required: ['@type', name]
      additionalProperties: false
      properties:
        '@type': { const: 'Person' }
        name: { $ref: '#/components/schemas/text' }
        url: { $ref: '#/components/schemas/url' }
        jobTitle: { $ref: '#/components/schemas/text' }
        sameAs:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/url' }
    webSite:
      type: object
      required: ['@type', '@id', url, name, inLanguage, publisher]
      additionalProperties: false
      properties:
        '@type': { const: 'WebSite' }
        '@id': { type: string, pattern: '#website$' }
        url: { $ref: '#/components/schemas/url' }
        name: { $ref: '#/components/schemas/text' }
        description: { $ref: '#/components/schemas/text' }
        inLanguage: { $ref: '#/components/schemas/language' }
        publisher: { $ref: '#/components/schemas/person' }
    blogPosting:
      type: object
      required:
        - '@type'
        - '@id'
        - url
        - mainEntityOfPage
        - headline
        - datePublished
        - dateModified
        - author
        - publisher
        - inLanguage
      additionalProperties: false
      properties:
        '@type': { const: 'BlogPosting' }
        '@id': { type: string, pattern: '#article$' }
        url: { $ref: '#/components/schemas/url' }
        mainEntityOfPage:
          type: object
          required: ['@type', '@id']
          additionalProperties: false
          properties:
            '@type': { const: 'WebPage' }
            '@id': { $ref: '#/components/schemas/url' }
        # Google truncates a longer headline in a rich result.
        headline: { type: string, minLength: 1, maxLength: 110 }
        description: { $ref: '#/components/schemas/text' }
        image:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/url' }
        datePublished: { $ref: '#/components/schemas/date' }
        dateModified: { $ref: '#/components/schemas/date' }
        author: { $ref: '#/components/schemas/person' }
        publisher: { $ref: '#/components/schemas/person' }
        articleSection: { $ref: '#/components/schemas/text' }
        keywords: { $ref: '#/components/schemas/text' }
        inLanguage: { $ref: '#/components/schemas/language' }
    aboutPage:
      type: object
      required: ['@type', '@id', url, name, inLanguage]
      additionalProperties: false
      properties:
        '@type': { const: 'AboutPage' }
        '@id': { $ref: '#/components/schemas/url' }
        url: { $ref: '#/components/schemas/url' }
        name: { $ref: '#/components/schemas/text' }
        description: { $ref: '#/components/schemas/text' }
        inLanguage: { $ref: '#/components/schemas/language' }
        primaryImageOfPage:
          type: object
          required: ['@type', url]
          additionalProperties: false
          properties:
            '@type': { const: 'ImageObject' }
            url: { $ref: '#/components/schemas/url' }
    profilePage:
      type: object
      required:
        - '@type'
        - '@id'
        - url
        - name
        - inLanguage
        - dateCreated
        - dateModified
        - mainEntity
      additionalProperties: false
      properties:
        '@type': { const: 'ProfilePage' }
        '@id': { $ref: '#/components/schemas/url' }
        url: { $ref: '#/components/schemas/url' }
        name: { $ref: '#/components/schemas/text' }
        inLanguage: { $ref: '#/components/schemas/language' }
        dateCreated: { $ref: '#/components/schemas/date' }
        dateModified: { $ref: '#/components/schemas/date' }
        mainEntity: { $ref: '#/components/schemas/person' }
    breadcrumbList:
      type: object
      required: ['@type', '@id', itemListElement]
      additionalProperties: false
      properties:
        '@type': { const: 'BreadcrumbList' }
        '@id': { type: string, pattern: '#breadcrumb$' }
        itemListElement:
          type: array
          minItems: 2
          items:
            type: object
            required: ['@type', position, name, item]
            additionalProperties: false
            properties:
              '@type': { const: 'ListItem' }
              position: { type: integer, minimum: 1 }
              name: { $ref: '#/components/schemas/text' }
              item: { $ref: '#/components/schemas/url' }
