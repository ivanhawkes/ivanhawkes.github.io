kanban-card:
  type: object
  required:
    - title
    - description
    - date
    - author
    - params
  additionalProperties: false
  properties:
    title:
      $ref: '#/components/schemas/title'
    description:
      $ref: '#/components/schemas/description'
    date:
      $ref: '#/components/schemas/date'
    author:
      $ref: '#/components/schemas/author'
    params:
      $ref: '#/components/schemas/params'
components:
  schemas:
    title:
      type: string
      maxLength: 40
    description:
      type: string
      maxLength: 50
    date:
      type: string
      format: date
      example: '2026-10-01'
    author:
      type: string
      maxLength: 40
    params:
      type: object
      required:
        - completionDate
        - due
        - dependencies
        - references
      additionalProperties: false
      properties:
        completionDate:
          type:
            - string
            - 'null'
          format: date
          example: '2026-10-01'
        due:
          type:
            - string
            - 'null'
          format: date
          example: '2026-10-01'
        references:
          type:
            - array
            - 'null'
          items:
            type: string
        dependencies:
          type:
            - array
            - 'null'
          items:
            type: string
