recipe-method:
  type: object
  required:
    - method-list
  additionalProperties: false
  properties:
    method-list:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/dish'
components:
  schemas:
    dish:
      type: object
      required:
        - dish
        - method
      additionalProperties: false
      properties:
        dish:
          type: string
          minLength: 1
          maxLength: 60
        method:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/step'
    step:
      type: string
      minLength: 1
