{{ define "main" }}
  {{/*  The page is set in the prose measure, with its title centred in it, as
        every other page is: `layout.css` centres the column in the panel.  */}}
  <div class="prose w-full prose-neutral prose-custom dark:prose-invert">
    <h1 class="text-center">{{ .Title }}</h1>

    <p>
      The page you asked for is missing. Try the
      <a href="{{ .Site.Home.RelPermalink }}">home page</a>.
    </p>
  </div>
{{ end }}
