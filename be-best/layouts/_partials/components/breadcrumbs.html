<nav aria-label="Breadcrumb" class="measure breadcrumb">
  <ol>
    {{- range .Ancestors.Reverse }}
      <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
      <li aria-hidden="true">&ensp;»&ensp;</li>
    {{- end }}
    <li><a href="{{ .RelPermalink }}" aria-current="page">{{ .LinkTitle }}</a></li>
  </ol>
</nav>
