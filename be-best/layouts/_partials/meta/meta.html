<!-- Mark this page as being the canonical version so Google will index it. -->
{{ if .Permalink }}
<link rel="canonical" href="{{ .Permalink }}" />
{{ end }}

{{ $description := .Description | default .Site.Params.description }}

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ $description }}">
<meta
  property="og:title"
  content="{{ .Site.Title }}{{ with .Title }}| {{ . }}{{ end }}">
<meta property="og:description" content="{{ $description }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="website">
<meta property="og:image" content="{{ .Site.Params.socialImage }}">
<meta name="twitter:card" content="summary_large_image">
<meta
  name="twitter:title"
  content="{{ .Site.Title }}{{ with .Title }}| {{ . }}{{ end }}">
<meta name="twitter:description" content="{{ $description }}">
<meta name="twitter:image" content="{{ .Site.Params.socialImage }}">
<meta name="twitter:site" content="{{ .Site.Params.twitterHandle }}">
