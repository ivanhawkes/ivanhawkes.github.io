<!-- Next / Previous. -->
<div class="measure next-prev mt-4 flex justify-between gap-6 rounded-md">
  <div
    class="flex flex-row items-center rounded-lg border-2 border-surface-brand bg-surface-brand p-1 text-surface-brand-ink">
    {{ with .PrevInSection }}
      <a
        class="flex flex-row items-center justify-start"
        href="{{ .Permalink }}">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="64"
          width="64"
          fill="white"
          viewBox="0 -960 960 960">
          <path d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z" />
        </svg>

        <div class="text-left">
          Previous
          <br />
          <span class="text-m">
            {{ .Title | truncate 32 }}
          </span>
        </div>
      </a>
    {{ end }}
  </div>
  <div
    class="flex flex-row items-center justify-end rounded-lg border-2 border-surface-brand bg-surface-brand p-1 text-surface-brand-ink">
    {{ with .NextInSection }}
      <a class="flex flex-row items-center justify-end" href="{{ .Permalink }}">
        <div class="text-right">
          Next
          <br />
          <span class="text-m">
            {{ .Title | truncate 32 }}
          </span>
        </div>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="64"
          width="64"
          fill="white"
          viewBox="0 -960 960 960">
          <path d="M504-480 320-664l56-56 240 240-240 240-56-56 184-184Z" />
        </svg>
      </a>
    {{ end }}
  </div>
</div>
