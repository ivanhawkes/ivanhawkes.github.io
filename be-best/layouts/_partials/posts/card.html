<div class="w-full rounded-md border bg-card p-2">
  <a href="{{ .Permalink }}">
    {{- partial "/images/featured-image.html" (dict "page" .) -}}
  </a>

  <div>
    <div class="text-lg">
      <a href="{{ .Permalink }}">{{ .Title }}</a>
    </div>
    <div class="line-clamp-4 text-sm">
      {{ with .Description }}{{ . }}{{ else }}{{ .Summary | transform.Plainify }}{{ end }}
    </div>
  </div>
</div>
