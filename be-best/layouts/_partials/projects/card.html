{{ $summary := .Summary | default .Description | default "Please add a summary and description to this entry." }}

<div class="w-full rounded-md border bg-card p-2">
  <a href="{{ .Permalink }}">
    {{- partial "/images/featured-image.html" (dict "page" .) -}}
  </a>

  <div>
    <div>
      <a href="{{ .Permalink }}">{{ .Title }}</a>
    </div>
    <div class="line-clamp-4">
      {{ with $summary }}{{ . | transform.Plainify }}{{ end }}
    </div>
  </div>
</div>
