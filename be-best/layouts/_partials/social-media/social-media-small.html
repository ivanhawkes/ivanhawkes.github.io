{{ with .github }}
  <a href="https://github.com/{{ . }}" target="_blank">
    <i class="fa-brands fa-github"></i>
    <span>Github</span>
  </a>
{{ end }}

{{ with .bitbucket }}
  <a href="https://bitbucket.com/{{ . }}" target="_blank">
    <i class="fa-brands fa-bitbucket"></i>

  </a>
{{ end }}

{{ with .twitter }}

  </a>
{{ end }}
