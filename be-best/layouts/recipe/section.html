{{ define "main" }}
  {{ partial "/page/content.html" . }}


  <div class="container card-list">
    {{/* Recipes are looked up by name, so they list alphabetically. */}}
    {{ $paginator := .Paginate .Pages.ByTitle 12 }}

    {{ range $paginator.Pages }}
      {{- partial "/recipes/card.html" . -}}
    {{ end }}
  </div>

  {{- partial "/pagination.html" . -}}
{{ end }}
