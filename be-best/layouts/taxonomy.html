{{ define "main" }}
  {{ partial "/page/content.html" . }}

  {{ $taxonomyObject := .Data.Terms }}

  <div
    class="container card-list">
    {{ range $term, $weightedPages := $taxonomyObject }}
      <div class="card">
        <div class="card-body">
          <h3 class="card-title"><a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}</a></h3>
          <div class="card-meta">{{ $weightedPages.Count }} entries</div>
        </div>
      </div>
    {{ end }}
  </div>
{{ end }}
