{{ define "main" }}
  <h1 class="text-2xl font-bold">{{ .Title }}</h1>

  {{ partial "page/content.html" . }}

  <div
    class="grid grid-cols-1 gap-4 space-y-4 space-x-4 md:grid-cols-2 xl:grid-cols-3">
    {{ range .Pages }}
      <div class="w-full rounded-md border bg-card p-2">
        <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
      </div>
    {{ end }}
  </div>
{{ end }}
