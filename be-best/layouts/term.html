{{ define "main" }}
  {{ partial "/page/content.html" . }}

  <div
    class="container card-list">
    {{ range .Pages }}
      <div class="card">
        <div class="card-body">
          <h3 class="card-title"><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h3>
        </div>
      </div>
    {{ end }}
  </div>
{{ end }}
