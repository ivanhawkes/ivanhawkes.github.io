method-list:
  - dish: Broccoli Bacon Salad
    method:
      - 'Lay out the bacon in an air fryer and blast at 200c for 10 minutes or
        until dried and crispy. Chop into small chunks when ready.'
      - 'Finely dice the onion.'
      - 'Cut the broccoli into small florettes.'
      - 'Put the dijon mustard, mayonaise, and salt in the serving bowl. Combine
        well.'
      - 'Toss in everything else. Combine well.'
