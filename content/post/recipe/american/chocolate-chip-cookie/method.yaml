method-list:
  - dish: Chocolate Chip Cookie
    method:
      - 'Whisk the flour, bicarbonate of soda, cornflour and salt together in a
        large bowl. Put it aside.'
      - 'Melt the butter. In a medium bowl, whisk the butter and brown sugar
        together until there are no lumps of sugar left.'
      - 'Whisk in the egg and the extra yolk, then the vanilla.'
      - 'Tip the wet mix into the dry and bring it together with a rubber
        spatula. It will be soft, thick and look greasy. That is fine.'
      - "Fold in the chocolate bits. They won't want to stick to the dough
        because of the melted butter, so just do your best."
      - 'Cover the bowl and chill the dough for at least 2 - 3 hours. Overnight
        is better, the cookies spread less. It will keep in the fridge for up to
        3 days.'
      - 'Take the dough out of the fridge and let it soften on the bench for 10
        minutes.'
      - 'Preheat the oven to 163°C. Line your trays with baking paper.'
      - 'Weigh out 50g of dough for each cookie, or 60g if you want them extra
        large.'
      - 'Roll each piece into a ball that is taller than it is wide, almost a
        cylinder. They bake up thicker that way. Give them plenty of room on the
        tray.'
      - 'Bake for 11 - 13 minutes, until the edges are only just starting to
        brown. The middles will still look soft, but they set as they cool.
        Extra large cookies need closer to 14 minutes.'
      - 'Leave them on the tray for 10 minutes, then move them to a wire rack to
        cool completely. Press a few extra chocolate bits into the tops while
        they are still warm if you want them to look the part.'
