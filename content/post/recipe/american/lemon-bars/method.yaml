method-list:
  - dish: Crust
    method:
      - 'Place a rack in middle of oven; preheat to 162° celsius.'
      - 'Line a 20 x 20 cm baking pan with parchment paper, leaving overhang on
        all sides.'
      - 'Pulse the flour, powdered sugar, and salt in a food processor to
        combine.'
      - 'Add the unsalted butter and pulse until mixture is sandy with very
        small butter pieces.'
      - 'Add 1 large egg yolk and pulse until combined; mixture will be very dry
        looking and powdery but should hold together when squeezed in your hand.'
      - 'Transfer mixture to prepared pan and spread into an even layer to fill
        pan. Using a flat-bottomed measuring cup or glass, pack into a
        compressed layer (use your fingers to get into the corners). Bake crust
        until golden, 27–29 minutes. Let cool 5 minutes (don’t go longer; it
        needs to be warm when you add the lemon mixture).'
  - dish: Filling
    method:
      - 'Place the granulated sugar and finely grated lemon zest in a medium
        bowl. Using your fingers, massage zest into sugar until fragrant and
        lightly tinted yellow, about 1 minute.'
      - 'Add eggs, egg yolk, and flour, and gently whisk just until combined.'
      - 'Add lemon juice, milk, and salt; stir to combine.'
      - 'Pour filling over slightly cooled crust and gently tap pan on counter
        to pop any air bubbles on surface. Bake until lemon mixture is set but
        still jiggles slightly when gently shaken, 20–25 minutes.'
      - 'Let lemon bar cool, then chill until cold, at least 4 hours.'
      - 'Using parchment paper overhang, lift lemon bar from pan and place on a
        cutting board. Cut into 16 squares.'
      - 'Dust lemon bars with powdered sugar just before serving.'
