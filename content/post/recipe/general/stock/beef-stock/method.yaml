method-list:
  - dish: Beef Stock
    method:
      - 'Optional: brown the beef either in the stock pot or the oven.'
      - 'Add the beef, onion, carrot, celery, parsley, leek greens (if using),
        and bay leaf to the pot. Cover with 6-8 litres of cold water.'
      - 'Bring to a boil on high heat and reduce to a low simmer. If scum rises
        to the surface of the pot (this usually happens in the first half hour
        of cooking), skim off with a large metal spoon. Let simmer at a low
        simmer, uncovered, for 4 to 6 hours.'
      - 'Use a large metal spoons with holes in it (or a "spider ladle") to
        ladle out the cooked beef and vegetables. (These aren''t really good to
        eat, by the way, because after 4 hours of cooking, all of the
        nutritional value has been cooked out of them.) Discard.'
      - 'Use a large sieve lined with dampened cheesecloth (if available) and
        place over a large bowl or another large pot. Pour the stock through the
        sieve into the bowl or pot to strain out any remaining solids.'
      - 'Either pour into jars at this point, or if you want, what we like to do
        is to boil the stock on high heat for 1 hour, to reduce it by about
        half. This way you are storing concentrated stock, which takes less room
        in the freezer or refrigerator. When you are ready, pour into jars.'
