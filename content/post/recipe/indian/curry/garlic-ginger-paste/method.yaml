method-list:
  - dish: Garlic and Ginger Paste
    method:
      - 'Chop up the garlic and ginger.'
      - 'Blend it into a paste using your food processor. Add water as needed to
        ensure a smooth paste.'
      - "Split it into 100g portions and add each to a freezer safe container.
        You should have close to 8 portions, so you might need to put one
        portion aside for tonight's dinner."
