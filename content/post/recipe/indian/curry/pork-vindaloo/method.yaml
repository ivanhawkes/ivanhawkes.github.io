method-list:
  - dish: Marinade
    method:
      - 'Cube the pork into one inch sized chunks.'
      - 'Add the vinegar, ginger, garlic, and spices into a blender. Blend into
        a purée.'
      - 'Massage the marinade into the pork.'
      - 'Place it in the fridge and let it marinate for a few hours or
        overnight.'
      - 'Heat the oil in a pan over medium-high heat.'
      - "Add the marinated pork. Stir occasionally for about 15 minutes. You're
        looking to see the oil split from the meat."
      - 'Pour in ½ cup of water and scrape the bottom of the pan to deglaze it.
        Reduce the heat to medium-low, cover, and simmer, stirring occasionally,
        until the pork is tender, about 15 minutes.'
      - 'Stir in the cilantro, and serve.'
